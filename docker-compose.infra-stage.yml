# Stage Stack - All-in-one (postgres + redis + api on pi-node)
# Usage: docker compose -f docker-compose.infra-stage.yml up -d
# Env vars loaded from .env.stage in the same directory
name: swing-trade-stage

services:
  frontend:
    image: swing-trade-dashboard:stage
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: swing-trade-stage-dashboard
    ports:
      - "8080:80"
    networks:
      - swingtrade-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: swing-trade-api:stage
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime-stage
    container_name: swing-trade-stage-api
    env_file:
      - .env.stage
    networks:
      - swingtrade-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:16
    container_name: swing_trade_stage_postgres
    volumes:
      - postgres_data_stage:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: swingtrade_stage
      POSTGRES_USER: swingtrade_user
      POSTGRES_PASSWORD: swingtrade_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5436:5432"
    networks:
      - swingtrade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingtrade_user -d swingtrade_stage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: swing_trade_stage_redis
    volumes:
      - redis_data_stage:/data
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    networks:
      - swingtrade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data_stage:
  redis_data_stage:

networks:
  swingtrade-network:
    driver: bridge