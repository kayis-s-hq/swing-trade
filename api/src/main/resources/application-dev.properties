# =============================================================================
# Swing Trade Application - Development Profile Configuration
# =============================================================================
# This file is loaded when SPRING_PROFILES_ACTIVE=dev
# Provides development-specific settings including DEBUG logging and hot reload
# =============================================================================


# =============================================================================
# LOGGING CONFIGURATION (Development - Verbose)
# =============================================================================
# Enable DEBUG level logging for comprehensive troubleshooting
# =============================================================================

logging.level.root=DEBUG
logging.level.com.swingtrade=DEBUG
logging.level.com.swingtrade.api=DEBUG
logging.level.com.swingtrade.data=DEBUG
logging.level.com.swingtrade.strategy=DEBUG
logging.level.com.swingtrade.llm=DEBUG
logging.level.com.swingtrade.broker=DEBUG
logging.level.com.swingtrade.core=DEBUG

# Specific package logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.flywaydb=DEBUG
logging.level.io.lettuce=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Log file configuration
logging.file.name=${LOG_FILE:./logs/swing-trade-dev.log}
logging.file.max-size=100MB
logging.file.max-history=10
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# JSON logging for development
logging.pattern.json=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n


# =============================================================================
# SPRING BOOT DevTOOLS CONFIGURATION (Hot Reload)
# =============================================================================
# Enables automatic application restart on file changes
# Significantly speeds up development workflow
# =============================================================================

# Enable Spring Boot DevTools
spring.devtools.additional-scanning-path=/app
spring.devtools.restart.enabled=true

# Restart configuration
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=500
spring.devtools.restart.delay=1000

# LiveReload for frontend development
spring.devtools.livereload.enabled=true

# Exclude files that should not trigger restart
spring.devtools.restart.exclude=META-INF/maven/**,static/**,public/**


# =============================================================================
# DATABASE CONFIGURATION (Docker Compose)
# =============================================================================
# Database connection settings for development environment
# Uses docker service names for service discovery
# =============================================================================

# Database URL (connected to postgres service in docker-compose.dev.yml)
spring.datasource.url=jdbc:postgresql://postgres:5432/swingtrade_db?currentSchema=public

# Database credentials
spring.datasource.username=swingtrade_user
spring.datasource.password=swingtrade_password

# Database driver
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (optimized for development)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=SwingTradeDevHikariCP
spring.datasource.hikari.auto-commit=false

# Development-friendly pool settings (smaller pool for local dev)
spring.datasource.hikari.max-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1


# =============================================================================
# JPA / HIBERNATE CONFIGURATION
# =============================================================================

# Database dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl-auto (validate in dev, do not modify schema)
spring.jpa.hibernate.ddl-auto=validate

# SQL visibility
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Additional Hibernate settings
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.id.new_generator_mappings=true


# =============================================================================
# REDIS CONFIGURATION (Docker Compose)
# =============================================================================
# Redis cache settings for development
# Connected to redis service in docker-compose.dev.yml
# =============================================================================

# Redis connection
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=5000ms

# Lettuce connection pool
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Cache configuration
spring.cache.type=redis
spring.cache.cache-names=stocks,ohlcv,signals,sentiment
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=swingtrade:
spring.cache.redis.use-key-prefix=true


# =============================================================================
# SERVER CONFIGURATION
# =============================================================================

# Server port (default 8080, can override with SERVER_PORT env var)
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true


# =============================================================================
# APPLICATION INFO
# =============================================================================

spring.application.name=swing-trade-api-dev


# =============================================================================
# UPSTOX API CONFIGURATION
# =============================================================================
# Uses mock Upstox when MOCK_UPSTOX_ENABLED=true
# =============================================================================

# Base API URL (override when using real Upstox)
upstox.api.base-url=${MOCK_UPSTOX_ENABLED=true?http://mock-upstox:8888:https://api.upstox.com}

# API endpoints
upstox.api.login-url=${upstox.api.base-url}/v2/login
upstox.api.token-url=${upstox.api.base-url}/v2/token
upstox.api.market-data-url=${upstox.api.base-url}/v2/market-data
upstox.api-order-url=${upstox.api.base-url}/v2/orders
upstox.api-subscription-url=${upstox.api.base-url}/v2/market-data/subscribe

# Client credentials (empty when using mock)
upstox.client-id=${UPSTOX_CLIENT_ID:}
upstox.client-secret=${UPSTOX_CLIENT_SECRET:}
upstox.redirect-uri=${UPSTOX_REDIRECT_URI:https://api.upstox.com/v2/login/callback}
upstox.api-key=${UPSTOX_API_KEY:}

# Rate limiting
upstox.api.rate-limit.requests-per-second=10
upstox.api.rate-limit.requests-per-minute=100

# Polling configuration
upstox.polling.enabled=${UPSTOX_POLLING_ENABLED:true}
upstox.polling.interval.seconds=${UPSTOX_POLLING_INTERVAL_SECONDS:60}
upstox.polling.max-retries=${UPSTOX_POLLING_MAX_RETRIES:3}
upstox.polling.retry-backoff.millis=${UPSTOX_POLLING_RETRY_BACKOFF_MILLIS:1000}


# =============================================================================
# LLM / VLLM CONFIGURATION
# =============================================================================
# Uses mock vLLM when MOCK_VLLM_ENABLED=true
# =============================================================================

# LLM base URL (override when using real LLM)
llm.base-url=${MOCK_VLLM_ENABLED=true?http://mock-vllm:8999:${LLM_BASE_URL:http://localhost:8000}}

# Model configuration
llm.model.name=${LLM_MODEL_NAME:meta-llama/Llama-3.2-3B-Instruct}
llm.temperature=${LLM_TEMPERATURE:0.0}
llm.timeout.millis=${LLM_TIMEOUT:30000}
llm.max-tokens=4096

# vLLM specific settings
llm.vllm.base-url=${LLM_VLLM_BASE_URL:http://localhost:8000}

# Retry configuration
llm.retry.enabled=true
llm.retry.max-attempts=3
llm.retry.backoff.millis=1000
llm.retry.exponential-backoff=true

# Sentiment analysis
llm.sentiment.prompt.system=You are a financial sentiment analyzer. Analyze the provided text and determine if the sentiment is POSITIVE, NEGATIVE, or NEUTRAL for trading purposes.
llm.sentiment.prompt.user=Analyze the sentiment of this financial news: {news_content}. Return only: POSITIVE, NEGATIVE, or NEUTRAL.
llm.sentiment.cache.max-size=100
llm.sentiment.cache.expiry-minutes=60
llm.sentiment.cache.enabled=true
llm.sentiment.default-confidence=0.75
llm.telegram.digest-chat-id=${TELEGRAM_DIGEST_CHAT_ID:123456789}

# News ingestion
news.nse.endpoint=https://nseindia.com/api/corporate-announcements
news.fetch.limit=50
news.cache.enabled=true
news.cache.ttl.seconds=3600


# =============================================================================
# SIGNAL NOTIFICATION CONFIGURATION
# =============================================================================

signal.enabled=${SIGNAL_ENABLED:false}
signal.api.token=${SIGNAL_API_TOKEN:}
signal.chat.id=${SIGNAL_CHAT_ID:}

# Notification settings
signal.notify.on.trades=true
signal.notify.on.signals=false
signal.notify.on.errors=false
signal.notify.max.message.length=4096

# Quiet hours (optional)
signal.quiet.hours.enabled=false
signal.quiet.hours.start=22
signal.quiet.hours.end=7


# =============================================================================
# TRADING CONFIGURATION
# =============================================================================

trading.enabled=${TRADING_ENABLED:false}
trading.paper.trading.enabled=${TRADING_PAPER_TRADING_ENABLED:true}
trading.max.position.size.percentage=${TRADING_MAX_POSITION_SIZE_PERCENTAGE:10}
trading.max.exposure.percentage=${TRADING_MAX_EXPOSURE_PERCENTAGE:50}
trading.stop.loss.percentage=${TRADING_STOP_LOSS_PERCENTAGE:5.0}
trading.take.profit.percentage=${TRADING_TAKE_PROFIT_PERCENTAGE:15.0}
trading.min.signal.confidence=${TRADING_MIN_SIGNAL_CONFIDENCE:60.0}

# Order settings
trading.order.type.DEFAULT=MARKET
trading.order.type.LIMIT=LIMIT
trading.order.expiry=DAY
trading.order.exchange=NSE


# =============================================================================
# STRATEGY CONFIGURATION
# =============================================================================

strategy.enabled=${STRATEGY_ENABLED:true}
strategy.decision.threshold=${STRATEGY_DECISION_THRESHOLD:60}
strategy.max.open.positions=${STRATEGY_MAX_OPEN_POSITIONS:5}
strategy.rebalance.interval.hours=${STRATEGY_REBALANCE_INTERVAL_HOURS:24}

# Technical Analysis settings
strategy.ta.rsi.period=${STRATEGY_TA_RSI_PERIOD:14}
strategy.ta.rsi.overbought=${STRATEGY_TA_RSI_OVERBOUGHT:70}
strategy.ta.rsi.oversold=${STRATEGY_TA_RSI_OVERSOLD:30}
strategy.ta.sma.period.short=${STRATEGY_TA_SMA_PERIOD_SHORT:20}
strategy.ta.sma.period.long=${STRATEGY_TA_SMA_PERIOD_LONG:50}
strategy.ta.ema.period.fast=${STRATEGY_TA_EMA_PERIOD_FAST:12}
strategy.ta.ema.period.slow=${STRATEGY_TA_EMA_PERIOD_SLOW:26}
strategy.ta.macd.fast=${STRATEGY_TA_MACD_FAST:12}
strategy.ta.macd.slow=${STRATEGY_TA_MACD_SLOW:26}
strategy.ta.macd.signal=${STRATEGY_TA_MACD_SIGNAL:9}


# =============================================================================
# FEATURE FLAGS
# =============================================================================

app.features.data-ingestion.enabled=true
app.features.strategy.enabled=true
app.features.sentiment-analysis.enabled=true
app.features.paper-trading.enabled=true
app.features.real-trading.enabled=false


# =============================================================================
# MONITORING & HEALTH CHECKS
# =============================================================================

app.monitoring.enabled=true
app.monitoring.metrics.interval.seconds=60
app.monitoring.health.interval.seconds=30

# Actuator configuration (reduced for development)
management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.exclude=env,configprops
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livelystate.enabled=true
management.health.readystate.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=10485760
management.endpoints.web.base-path=/actuator
