# =============================================================================
# Swing Trade Application - Local Development Configuration
# =============================================================================
# This file contains development-specific settings for local machine
# Use environment variables for sensitive data in production
# =============================================================================

# =============================================================================
# Server Configuration (Local)
# =============================================================================
server.port=8080
server.servlet.context-path=/api

# Enable Spring Boot DevTools for hot reload
spring.devtools.add-properties=true
spring.devtools.add-excluded-properties=false
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# =============================================================================
# Database Configuration (Local - PostgreSQL + TimescaleDB)
# =============================================================================
# Local database connection via Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/swingtrade_db
spring.datasource.username=swingtrade_user
spring.datasource.password=swingtrade_password

# Use development connection pool settings
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=10000

# Enable SQL logging in development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Allow schema updates for development (use with caution!)
spring.jpa.hibernate.ddl-auto=validate

# =============================================================================
# Redis Configuration (Local)
# =============================================================================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=

# Development cache settings - shorter TTL for faster testing
spring.cache.redis.time-to-live=300000
spring.cache.redis.key-prefix=local:swingtrade:

# =============================================================================
# Upstox API Configuration (Development/Sandbox)
# =============================================================================
# Set to false for development - no real trading
upstox.api.base-url=https://api.upstox.com
upstox.api.login-url=https://api.upstox.com/v2/login
upstox.api.token-url=https://api.upstox.com/v2/token
upstox.api-market-data-url=https://api.upstox.com/v2/market-data
upstox.api-order-url=https://api.upstox.com/v2/orders
upstox.api-subscription-url=https://api.upstox.com/v2/market-data/subscribe

# Development mode - disable actual trading
trading.enabled=false
trading.paper.trading.enabled=true
real.trading.enabled=false

# Mock API credentials for development (replace with actual values)
upstox.client-id=${UPSTOX_CLIENT_ID:mock_client_id}
upstox.client-secret=${UPSTOX_CLIENT_SECRET:mock_client_secret}
upstox.api-key=${UPSTOX_API_KEY:mock_api_key}

# =============================================================================
# LLM / vLLM Configuration (Local Development)
# =============================================================================
# Local vLLM endpoint
llm.base-url=http://localhost:8000
llm.model.name=${LLM_MODEL_NAME:meta-llama/Llama-3.2-3B-Instruct}
llm.temperature=0.0
llm.timeout.millis=30000
llm.max-tokens=4096

# Disable LLM in development if not running
llm.enabled=${LLM_ENABLED:true}

# =============================================================================
# Telegram Bot Configuration (Development)
# =============================================================================
# Enable/disable Telegram notifications
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}

# Disable notifications in local development by default
telegram.notify.on.trades=false
telegram.notify.on.signals=false
telegram.notify.on.errors=true
telegram.notify.on.positions=false

# =============================================================================
# Trading Configuration (Development Mode)
# =============================================================================
# Paper trading only in development
trading.enabled=false
trading.paper.trading.enabled=true
trading.simulation.mode=true

# Conservative position limits for development
trading.max.position.size.percentage=5
trading.max.exposure.percentage=25
trading.stop.loss.percentage=3.0
trading.take.profit.percentage=10.0
trading.min.signal.confidence=70.0

# =============================================================================
# Strategy Configuration (Development)
# =============================================================================
# Conservative strategy settings for development
strategy.enabled=true
strategy.decision.threshold=70
strategy.max.open.positions=3

# =============================================================================
# Logging Configuration (Development)
# =============================================================================
# Verbose logging for development
logging.level.root=INFO
logging.level.com.swingtrade=DEBUG
logging.level.com.swingtrade.api=DEBUG
logging.level.com.swingtrade.data=DEBUG
logging.level.com.swingtrade.strategy=DEBUG
logging.level.com.swingtrade.llm=DEBUG
logging.level.com.swingtrade.broker=DEBUG
logging.level.com.swingtrade.core=DEBUG

# SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.flywaydb=DEBUG

# Console output with color support (if terminal supports it)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %bold-green(%-40.40logger{39}) - %bold-yellow(%msg%n)

# Development log file - smaller size for local development
logging.file.name=./logs/swing-trade-local.log
logging.file.max-size=50MB
logging.file.max-history=7

# =============================================================================
# Actuator / Health Check Configuration (Development)
# =============================================================================
# Expose more actuator endpoints in development
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,configprops,threaddump
management.endpoints.web.exposure.exclude=
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# =============================================================================
# Security Configuration (Development)
# =============================================================================
# Disable CSRF for development API testing
spring.security.filter.enabled=false

# Development CORS settings
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000
spring.web.cors.allowed-credentials=true

# =============================================================================
# Feature Flags (Development)
# =============================================================================
app.features.data-ingestion.enabled=true
app.features.strategy.enabled=true
app.features.sentiment-analysis.enabled=true
app.features.paper-trading.enabled=true
app.features.real-trading.enabled=false
app.features.scheduler.enabled=false

# =============================================================================
# Database Initialization for Development
# =============================================================================
# Create database if not exists (PostgreSQL specific)
spring.datasource.initialization-mode=never

# =============================================================================
# Testing Configuration
# =============================================================================
# Test profile settings
spring.test.mockmvc=false

# =============================================================================
# Additional Development Utilities
# =============================================================================
# Enable OpenAPI documentation
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# =============================================================================
# Note for Developers
# =============================================================================
# ================================================================
# LOCAL DEVELOPMENT ONLY - DO NOT USE IN PRODUCTION
# ================================================================
#
# Remember to:
# 1. Use environment variables for sensitive credentials
# 2. Disable paper trading when testing with real data
# 3. Use conservative trading limits
# 4. Monitor database connections carefully
# 5. Keep detailed logs for debugging
#
# To use production settings, create application-prod.properties
# or set the SPRING_PROFILES_ACTIVE environment variable
# ================================================================
