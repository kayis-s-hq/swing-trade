# Test Profile Configuration
spring.profiles.active=test

# Database Configuration (TestContainer will override these)
spring.datasource.url=jdbc:postgresql://localhost:5432/swing_trade_test
spring.datasource.username=swing_trade_test
spring.datasource.password=swing_trade_test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis (disabled for tests - use memory backend)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.health.time-to-live=0s

# Logging
logging.level.com.swingtrade=DEBUG
logging.level.org.springframework.test.context=DEBUG
logging.level.org.testcontainers=INFO

# Test Container Timeout (increase for slower environments)
testcontainers.containers.container-startup-timeout=60s
testcontainers.containers.reuse.enable=false

# Actuator (for health endpoint testing)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Scheduling (disabled for tests)
spring.task.scheduler.pool.size=1

# Telegram (disabled for tests)
telegram.enabled=false
