# Test configuration for Phase 7 Observability
spring.datasource.url=jdbc:postgresql://localhost:5432/swingtrade_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=when_authorized

# Scheduling
spring.task.scheduler.pool.size=5
spring.task.scheduler.thread-name-prefix=test-scheduled-

# Telegram (disabled for tests)
telegram.enabled=false
telegram.chat-id=
