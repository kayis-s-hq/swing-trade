name: Deploy Main

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Spring profile'
        default: local,fyers
        required: false

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  JAVA_VERSION: 21

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build backend (with tests)
        working-directory: backend
        run: ./gradlew build -B -x test

      - name: Run tests
        working-directory: backend
        run: ./gradlew test -B

      - name: Verify JAR
        working-directory: backend/api/build/libs
        run: ls -la api-*.jar

      - name: Stop existing main app
        run: |
          pkill -f "swing-trade-main.jar" 2>/dev/null || true
          pkill -f "swing-trade-api.jar.*main" 2>/dev/null || true
          sleep 3

      - name: Deploy and start main
        run: |
          cp backend/api/build/libs/api-*.jar /home/dietpi/swing-trade/main/swing-trade-api.jar
          cd /home/dietpi/swing-trade/main
          set -a && source .env && set +a
          export SPRING_PROFILES_ACTIVE=main
          mkdir -p /home/dietpi/swing-trade/logs
          nohup java -jar swing-trade-api.jar \
            -Duser.timezone=Asia/Kolkata \
            -Dserver.port=8080 \
            -Dlogging.file.name=/home/dietpi/swing-trade/logs/main.log \
            > /home/dietpi/swing-trade/logs/main-start.log 2>&1 &
          echo "Started main (PID: $!)"
          sleep 5
          echo "=== Startup log ==="
          cat /home/dietpi/swing-trade/logs/main-start.log

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Main is UP on port 8080"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 6
          done
          echo "Health check failed"
          echo "=== Startup log ==="
          cat /home/dietpi/swing-trade/logs/main-start.log 2>/dev/null || true
          echo "=== Process check ==="
          ps aux | grep swing-trade-api | grep -v grep || echo "No swing-trade process found"
          exit 1
