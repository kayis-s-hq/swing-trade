name: Deploy Dev

on:
  push:
    branches: [dev]
    paths:
      - backend/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      profile:
        description: 'Spring profile'
        default: local,fyers
        required: false

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  JAVA_VERSION: 21

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build backend
        working-directory: backend
        run: mvn clean package -Dpmd.skip=true -DskipTests -Dcheckstyle.skip=true -B

      - name: Verify JAR
        working-directory: backend/api/target
        run: ls -la api-1.0.0.jar

      - name: Write .env for deployment
        working-directory: backend
        run: |
          cat > .env <<EOF
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_REDIS_HOST=${{ secrets.SPRING_REDIS_HOST }}
          SPRING_REDIS_PORT=${{ secrets.SPRING_REDIS_PORT }}
          SPRING_PROFILES_ACTIVE=local
          SERVER_PORT=8080
          EOF

      - name: Deploy to pi-node (local)
        working-directory: backend
        run: |
          chmod +x deploy.sh
          ./deploy.sh deploy dev

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Dev is UP on port 8080"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 6
          done
          echo "Health check failed"
          exit 1