name: Deploy Dev

on:
  push:
    branches: [dev]
    paths:
      - backend/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      profile:
        description: 'Spring profile'
        default: local,fyers
        required: false

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  JAVA_VERSION: 21

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install Fyers SDK
        run: |
          JAR=$(pwd)/backend/data/libs/fyersjavasdk-1.9.0.jar
          mvn install:install-file -Dfile="$JAR" -DgroupId=com.tts.in -DartifactId=fyersjavasdk -Dversion=1.9.0 -Dpackaging=jar

      - name: Build backend
        working-directory: backend
        run: mvn clean package -Dpmd.skip=true -DskipTests -Dcheckstyle.skip=true -B

      - name: Verify JAR
        working-directory: backend/api/target
        run: ls -la api-1.0.0.jar

      - name: Write .env for dev
        run: |
          mkdir -p /home/dietpi/swing-trade/dev
          cat > /home/dietpi/swing-trade/dev/.env <<EOF
          # Database Configuration
          SPRING_DATASOURCE_URL=jdbc:postgresql://192.168.0.100:5435/swingtrade_db
          SPRING_DATASOURCE_USERNAME=swingtrade_user
          SPRING_DATASOURCE_PASSWORD=swingtrade_password

          # Redis Configuration
          SPRING_REDIS_HOST=192.168.0.100
          SPRING_REDIS_PORT=6379

          # Active Profiles
          SPRING_PROFILES_ACTIVE=local
          SERVER_PORT=8080
          EOF

      - name: Stop existing dev app
        run: |
          pkill -f "swing-trade-dev.jar" 2>/dev/null || true
          pkill -f "swing-trade-api.jar.*dev" 2>/dev/null || true
          sleep 3

      - name: Copy JAR and start dev
        run: |
          cp backend/api/target/api-1.0.0.jar /home/dietpi/swing-trade/dev/swing-trade-api.jar
          cd /home/dietpi/swing-trade/dev
          set -a && source .env && set +a
          export SPRING_PROFILES_ACTIVE=local
          mkdir -p /var/log/swing-trade
          nohup java -jar swing-trade-api.jar \
            -Dserver.port=8080 \
            -Dlogging.file.name=/var/log/swing-trade/dev.log \
            > /var/log/swing-trade/dev-start.log 2>&1 &
          echo "Started dev (PID: $!)"
          sleep 5
          echo "=== Startup log (last 30 lines) ==="
          tail -30 /var/log/swing-trade/dev-start.log

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Dev is UP on port 8080"
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 8
          done
          echo "Health check failed"
          echo "=== Latest logs ==="
          tail -50 /var/log/swing-trade/dev.log 2>/dev/null || true
          exit 1