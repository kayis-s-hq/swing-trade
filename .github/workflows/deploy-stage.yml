name: Deploy Stage

on:
  push:
    branches: [stage]
    paths:
      - backend/**
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      profile:
        description: 'Spring profile'
        default: stage
        required: false

concurrency:
  group: deploy-stage
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  PI_NODE_HOST: "127.0.0.1"

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install Fyers SDK
        working-directory: backend/data
        run: mvn install:install-file -Dfile=libs/fyersjavasdk-1.9.0.jar -DgroupId=com.tts.in -DartifactId=fyersjavasdk -Dversion=1.9.0 -Dpackaging=jar

      - name: Build backend
        working-directory: backend
        run: mvn clean package -Dpmd.skip=true -DskipTests -Dcheckstyle.skip=true -B

      - name: Verify JAR
        working-directory: backend/api/target
        run: ls -la api-1.0.0.jar

      - name: Write .env for stage
        run: |
          mkdir -p /home/dietpi/swing-trade/stage
          cat > /home/dietpi/swing-trade/stage/.env <<EOF
          # Database Configuration
          SPRING_DATASOURCE_URL=jdbc:postgresql://192.168.0.100:5436/swingtrade_stage
          SPRING_DATASOURCE_USERNAME=swingtrade_user
          SPRING_DATASOURCE_PASSWORD=swingtrade_password

          # Redis Configuration
          SPRING_REDIS_HOST=192.168.0.100
          SPRING_REDIS_PORT=6380

          # Active Profiles
          SPRING_PROFILES_ACTIVE=stage
          SERVER_PORT=8081
          EOF

      - name: Stop existing stage app
        run: |
          pkill -f "swing-trade-api.jar" 2>/dev/null || true
          sleep 3

      - name: Copy JAR and start stage
        run: |
          cp backend/api/target/api-1.0.0.jar /home/dietpi/swing-trade/stage/swing-trade-api.jar
          cd /home/dietpi/swing-trade/stage
          # Source .env for env vars
          set -a && source .env && set +a
          export SPRING_PROFILES_ACTIVE=stage
          mkdir -p /var/log/swing-trade
          nohup java -jar swing-trade-api.jar \
            -Dserver.port=8081 \
            -Dlogging.file.name=/var/log/swing-trade/stage.log \
            > /var/log/swing-trade/stage-start.log 2>&1 &
          echo "Started stage (PID: $!)"
          sleep 5
          echo "=== Startup log (last 30 lines) ==="
          tail -30 /var/log/swing-trade/stage-start.log

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"UP"'; then
              echo "Stage is UP on port 8081"
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 8
          done
          echo "Health check failed"
          echo "=== Latest logs ==="
          tail -50 /var/log/swing-trade/stage.log 2>/dev/null || true
          exit 1