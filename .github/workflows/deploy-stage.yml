name: Deploy Stage

on:
  push:
    branches: [stage]
    paths:
      - backend/**
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: deploy-stage
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  DOCKER_IMAGE: swing-trade-api
  DOCKER_TAG: stage

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install GraalVM 21 with native-image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null 2>&1 || true
          if [ ! -f "$HOME/.sdkman/bin/sdkman-init.sh" ]; then
            curl -s "https://get.sdkman.io" | bash
          fi
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          if ! java -version 2>&1 | grep -q "GraalVM"; then
            sdk install java 21.0.12-graal 2>/dev/null || true
            source "$HOME/.sdkman/bin/sdkman-init.sh"
          fi
          java -version
          native-image --version

      - name: Build native image
        working-directory: backend
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          export JAVA_HOME="$HOME/.sdkman/candidates/java/21.0.12-graal"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn package -Pnative -Dmaven.test.skip=true -Dpmd.skip=true -Dcheckstyle.skip=true -B

      - name: Copy native binary to Docker context
        run: cp backend/api/target/native/image/swing-trade-api backend/

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          target: runtime-native
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Stop existing stage API container
        run: |
          docker stop swing-trade-stage-api 2>/dev/null || true
          docker rm swing-trade-stage-api 2>/dev/null || true
          sleep 3

      - name: Verify stage infrastructure is healthy
        run: |
          echo "Checking stage PostgreSQL..."
          docker inspect swing_trade_stage_postgres --format '{{.State.Health.Status}}' || exit 1
          echo "Checking stage Redis..."
          docker inspect swing_trade_stage_redis --format '{{.State.Health.Status}}' || exit 1
          echo "Checking swingtrade-network..."
          docker network inspect swing-trade-stage_swingtrade-network --format '{{.Name}}' || exit 1

      - name: Start stage API container on swingtrade-network
        run: |
          docker run -d \
            --name swing-trade-stage-api \
            --network swing-trade-stage_swingtrade-network \
            -p 8081:8080 \
            -e SPRING_PROFILES_ACTIVE=stage \
            -e DB_HOST=swing_trade_stage_postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=swingtrade_stage \
            -e DB_USER=swingtrade_user \
            -e DB_PASSWORD=swingtrade_password \
            -e REDIS_HOST=swing_trade_stage_redis \
            -e REDIS_PORT=6379 \
            -e LLM_BASE_URL=http://localhost:8000 \
            -e LLM_MODEL_NAME=claude-sonnet-4-6 \
            -e LLM_TIMEOUT=30000 \
            -e TRADING_ENABLED=true \
            -e PAPER_TRADING_ENABLED=true \
            -e REAL_TRADING_ENABLED=false \
            -e STRATEGY_ENABLED=true \
            -e SIGNAL_ENABLED=false \
            -e DISCORD_WEBHOOK_ENABLED=false \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Wait for startup
        run: sleep 10

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"UP"'; then
              echo "Stage API is UP on port 8081"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 6
          done
          echo "Health check failed"
          docker logs --tail 30 swing-trade-stage-api
          docker ps --filter name=swing-trade-stage-api
          exit 1

      - name: Verify Prometheus scrape target
        run: |
          echo "Verifying Prometheus can reach stage API..."
          if curl -sf http://localhost:9090/api/v1/targets | grep -q '"job":"swing-trade-stage"'; then
            echo "Prometheus target found"
          else
            echo "WARNING: Prometheus target not found — may take one scrape interval to appear"
          fi