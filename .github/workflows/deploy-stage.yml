name: Deploy Stage

on:
  push:
    branches: [stage]
    paths:
      - backend/**
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: deploy-stage
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  DOCKER_IMAGE: swing-trade-api
  DOCKER_TAG: dev

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install Fyers SDK
        run: |
          JAR=$(find . -name fyersjavasdk-1.9.0.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then echo "FYERS SDK not found"; exit 1; fi
          echo "Found: $JAR"
          mvn install:install-file -Dfile="$JAR" -DgroupId=com.tts.in -DartifactId=fyersjavasdk -Dversion=1.9.0 -Dpackaging=jar

      - name: Clean corrupted Maven cache
        run: rm -rf ~/.m2/repository/io/projectreactor/reactor-core

      - name: Build backend
        working-directory: backend
        run: mvn clean package -Dpmd.skip=true -Dcheckstyle.skip=true -B

      - name: Verify JAR
        working-directory: backend/api/target
        run: ls -la api-1.0.0.jar

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} -f backend/Dockerfile --target runtime-jar ..

      - name: Stop existing stage API container
        run: |
          docker stop swing-trade-stage-api 2>/dev/null || true
          docker rm swing-trade-stage-api 2>/dev/null || true
          sleep 3

      - name: Verify stage infrastructure is healthy
        run: |
          echo "Checking stage PostgreSQL..."
          docker inspect swing_trade_stage_postgres --format '{{.State.Health.Status}}' || exit 1
          echo "Checking stage Redis..."
          docker inspect swing_trade_stage_redis --format '{{.State.Health.Status}}' || exit 1
          echo "Checking swingtrade-network..."
          docker network inspect swing-trade-stage_swingtrade-network --format '{{.Name}}' || exit 1

      - name: Start stage API container on swingtrade-network
        run: |
          docker run -d \
            --name swing-trade-stage-api \
            --network swing-trade-stage_swingtrade-network \
            -p 8081:8080 \
            -e SPRING_PROFILES_ACTIVE=stage \
            -e DB_HOST=swing_trade_stage_postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=swingtrade_stage \
            -e DB_USER=swingtrade_user \
            -e DB_PASSWORD=swingtrade_password \
            -e REDIS_HOST=swing_trade_stage_redis \
            -e REDIS_PORT=6379 \
            -e LLM_BASE_URL=http://localhost:8000 \
            -e LLM_MODEL_NAME=claude-sonnet-4-6 \
            -e LLM_TIMEOUT=30000 \
            -e TRADING_ENABLED=true \
            -e PAPER_TRADING_ENABLED=true \
            -e REAL_TRADING_ENABLED=false \
            -e STRATEGY_ENABLED=true \
            -e SIGNAL_ENABLED=false \
            -e DISCORD_WEBHOOK_ENABLED=false \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} \
            java -jar /app/swing-trade-api.jar

      - name: Wait for startup
        run: sleep 20

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"UP"'; then
              echo "Stage API is UP on port 8081"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 6
          done
          echo "Health check failed"
          docker logs --tail 30 swing-trade-stage-api
          docker ps --filter name=swing-trade-stage-api
          exit 1

      - name: Verify Prometheus scrape target
        run: |
          echo "Verifying Prometheus can reach stage API..."
          if curl -sf http://localhost:9090/api/v1/targets | grep -q '"job":"swing-trade-stage"'; then
            echo "Prometheus target found"
          else
            echo "WARNING: Prometheus target not found — may take one scrape interval to appear"
          fi