name: Deploy Stage

on:
  push:
    branches: [stage]
    paths:
      - backend/**
      - dashboard/**
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: deploy-stage
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  DOCKER_IMAGE: swing-trade-api
  DOCKER_TAG: stage

jobs:
  # =====================================================================
  # Backend CI: static analysis, compile, test
  # =====================================================================
  backend-ci:
    name: Backend CI
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Static analysis (PMD + Checkstyle) — all modules
        working-directory: backend
        run: MAVEN_OPTS="-Xms256m -Xmx512m" mvn checkstyle:check pmd:check -B -DskipTests -Dpmd.failOnViolation=true -Dcheckstyle.failOnViolation=true

      - name: Compile + package (with tests)
        working-directory: backend
        run: MAVEN_OPTS="-Xms256m -Xmx512m" mvn clean verify -B -Dpmd.skip=true -Dcheckstyle.skip=true

  # =====================================================================
  # Frontend CI: lint, typecheck, build, tests
  # =====================================================================
  frontend-ci:
    name: Frontend CI
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('dashboard/package.json', 'dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: ESLint
        run: npm run lint
        working-directory: dashboard

      - name: TypeScript typecheck
        run: npm run typecheck
        working-directory: dashboard

      - name: Vite build
        run: npm run build
        working-directory: dashboard

      - name: Vitest unit tests
        run: npm run test -- --run
        working-directory: dashboard

      - name: Playwright E2E tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: dashboard

  # =====================================================================
  # Deploy: infra, Docker build, container start, health check
  # =====================================================================
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Start stage infrastructure
        run: |
          cd backend
          docker compose -f docker-compose.infra-stage.yml up -d
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            if docker inspect swing_trade_stage_postgres --format '{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy"; then
              echo "PostgreSQL is healthy"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 4
          done
          echo "Waiting for Redis..."
          for i in $(seq 1 15); do
            if docker exec swing_trade_stage_redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
              echo "Redis is healthy"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 4
          done

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-stage-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-docker-stage-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          dockerfile: Dockerfile
          target: runtime-stage
          tags: ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Write secrets to .env
        run: |
          cat > backend/.env.stage <<'ENDOFENV'
          DB_HOST=swing_trade_stage_postgres
          DB_PORT=5432
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_HOST=swing_trade_stage_redis
          REDIS_PORT=6379
          LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME=${{ secrets.LLM_MODEL_NAME }}
          LLM_TIMEOUT=${{ secrets.LLM_TIMEOUT }}
          TRADING_ENABLED=true
          PAPER_TRADING_ENABLED=true
          REAL_TRADING_ENABLED=false
          STRATEGY_ENABLED=true
          SIGNAL_ENABLED=false
          DISCORD_WEBHOOK_ENABLED=false
          ENDOFENV

      - name: Stop existing stage API container
        run: |
          docker stop swing-trade-stage-api 2>/dev/null || true
          docker rm swing-trade-stage-api 2>/dev/null || true
          sleep 3

      - name: Start stage API container
        run: |
          docker run -d \
            --name swing-trade-stage-api \
            -p 8081:8080 \
            --network swing-trade-stage_swingtrade-network \
            -e SPRING_PROFILES_ACTIVE=stage \
            --env-file backend/.env.stage \
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Wait for startup
        run: sleep 10

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081/actuator/health | grep -q '"UP"'; then
              echo "Stage API is UP on port 8081"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 6
          done
          echo "Health check failed"
          docker logs --tail 50 swing-trade-stage-api
          docker ps --filter name=swing-trade-stage-api
          exit 1

      - name: Verify Prometheus scrape target
        run: |
          echo "Verifying Prometheus can reach stage API..."
          if curl -sf http://localhost:9090/api/v1/targets | grep -q '"job":"swing-trade-stage"'; then
            echo "Prometheus target found"
          else
            echo "WARNING: Prometheus target not found — may take one scrape interval to appear"
          fi