name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: 21
  NODE_VERSION: 20
  MAVEN_OPTS: -Xmx2g

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java ${{ env.JAVA_VERSION }})
    runs-on: self-hosted

    steps:
      - name: Checkout
        run: |
          if [ -d .git ]; then git pull; else git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kayis-s-hq/swing-trade.git .; fi

      - name: Install Fyers SDK
        run: |
          JAR=$(find . -name fyersjavasdk-1.9.0.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then echo "FYERS SDK not found"; exit 1; fi
          echo "Found: $JAR"
          mvn install:install-file -Dfile="$JAR" -DgroupId=com.tts.in -DartifactId=fyersjavasdk -Dversion=1.9.0 -Dpackaging=jar

      - name: Clean corrupted Maven cache
        run: rm -rf ~/.m2/repository/io/projectreactor/reactor-core

      - name: Build and test
        working-directory: backend
        run: mvn clean verify -B -Dspring.profiles.active=test -Dspring.datasource.url=jdbc:postgresql://localhost:5435/swingtrade_db -Dspring.datasource.username=swingtrade_user -Dspring.datasource.password=swingtrade_password -Dspring.redis.host=localhost -Dspring.redis.port=6379

      - name: Collect reports
        if: always()
        run: |
          mkdir -p /tmp/reports/jacoco /tmp/reports/pmd /tmp/reports/checkstyle
          cp -r backend/*/target/site/jacoco/* /tmp/reports/jacoco/ 2>/dev/null || true
          cp -r backend/*/target/site/pmd.html /tmp/reports/pmd/ 2>/dev/null || true
          cp -r backend/*/target/site/checkstyle-result.xml /tmp/reports/checkstyle/ 2>/dev/null || true

      - name: Deploy reports to Pi
        if: github.ref == 'refs/heads/main' && success()
        run: |
          scp -r /tmp/reports/* pi@piworm.local:/home/dietpi/swing-trade/reports/

      - name: Start reports nginx on Pi
        if: github.ref == 'refs/heads/main' && success()
        run: |
          ssh pi@piworm.local '
            mkdir -p ~/swing-trade/reports
            docker compose -f ~/swing-trade/docker-compose.reports.yml up -d 2>/dev/null || true
          '

  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          if [ -d .git ]; then git pull; else git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kayis-s-hq/swing-trade.git .; fi

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run typecheck
        run: npm run typecheck
        working-directory: dashboard

      - name: Run unit tests
        run: npm run test -- --run
        working-directory: dashboard

      - name: Run E2E tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard

  security:
    name: Security Scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        run: |
          if [ -d .git ]; then git pull; else git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/kayis-s-hq/swing-trade.git .; fi

      - name: Run OWASP dependency check
        run: |
          if command -v owasp-sbom &> /dev/null; then
            owasp-sbom -f XML -o reports/owasp.xml
          else
            echo "OWASP SBOM not installed, skipping"
          fi

      - name: Check for secrets
        run: |
          if command -v trufflehog &> /dev/null; then
            trufflehog filesystem --only-passed .
          else
            echo "TruffleHog not installed, skipping"
          fi