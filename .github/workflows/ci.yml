name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xms256m -Xmx512m

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test (parallel modules)
        working-directory: backend
        run: MAVEN_OPTS="$JAVA_OPTS" mvn verify -B -T 1C -Dspring.profiles.active=test -Dpmd.skip=true -Dcheckstyle.skip=false

      - name: Collect reports
        if: always()
        run: |
          mkdir -p /tmp/reports/jacoco /tmp/reports/pmd /tmp/reports/checkstyle
          cp -r backend/*/target/site/jacoco/* /tmp/reports/jacoco/ 2>/dev/null || true
          cp -r backend/*/target/site/pmd.html /tmp/reports/pmd/ 2>/dev/null || true
          cp -r backend/*/target/site/checkstyle-result.xml /tmp/reports/checkstyle/ 2>/dev/null || true

      - name: Upload reports
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: /tmp/reports/
          retention-days: 7

      - name: Deploy reports to Pi
        if: github.ref == 'refs/heads/main' && success()
        run: |
          scp -r /tmp/reports/* pi@piworm.local:/home/dietpi/swing-trade/reports/

      - name: Start reports nginx on Pi
        if: github.ref == 'refs/heads/main' && success()
        run: |
          ssh pi@piworm.local '
            mkdir -p ~/swing-trade/reports
            docker compose -f ~/swing-trade/docker-compose.reports.yml up -d 2>/dev/null || true
          '

  frontend:
    name: Frontend (Node 20)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('dashboard/package.json', 'dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run typecheck
        run: npm run typecheck
        working-directory: dashboard

      - name: Run unit tests
        run: npm run test -- --run
        working-directory: dashboard

      - name: Run E2E tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dashboard/dist/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP dependency check
        run: |
          if command -v owasp-sbom &> /dev/null; then
            owasp-sbom -f XML -o reports/owasp.xml
          else
            echo "OWASP SBOM not installed, skipping"
          fi

      - name: Check for secrets
        run: |
          if command -v trufflehog &> /dev/null; then
            trufflehog filesystem --only-passed .
          else
            echo "TruffleHog not installed, skipping"
          fi