name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xms256m -Xmx512m
  GRADLE_OPTS: -Xms256m -Xmx512m

jobs:
  # =====================================================================
  # Phase 1: Static Analysis (PMD + Checkstyle) — per module, parallel
  # =====================================================================
  static-analysis:
    name: Static Analysis (${{ matrix.module }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: [core, data, strategy, llm, broker, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/gradle/**/*.kts', backend/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Checkstyle + PMD
        working-directory: backend/${{ matrix.module }}
        run: ../gradlew :${{ matrix.module }}:checkstyleMain :${{ matrix.module }}:pmdMain -B

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-${{ matrix.module }}
          path: backend/${{ matrix.module }}/build/reports/pmd/pmd.html
          retention-days: 7

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-${{ matrix.module }}
          path: backend/${{ matrix.module }}/build/reports/checkstyle/checkstyleMain.xml
          retention-days: 7

  # =====================================================================
  # Phase 2: Compile — per module, parallel (depends on static-analysis)
  # =====================================================================
  compile:
    name: Compile (${{ matrix.module }})
    runs-on: self-hosted
    needs: [static-analysis]
    strategy:
      fail-fast: false
      matrix:
        module: [core, data, strategy, llm, broker, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/gradle/**/*.kts', backend/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compile + jar (skip tests)
        working-directory: backend/${{ matrix.module }}
        run: ../gradlew :${{ matrix.module }}:jar -B -x test

      - name: Upload JAR
        if: matrix.module == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: backend/api/build/libs/api-*.jar
          retention-days: 1

  # =====================================================================
  # Phase 3: Tests — all modules (unit + integration)
  # =====================================================================
  test:
    name: Tests (${{ matrix.module }})
    runs-on: self-hosted
    needs: [compile]
    strategy:
      fail-fast: false
      matrix:
        module: [core, data, strategy, llm, broker, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/gradle/**/*.kts', backend/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Tests
        working-directory: backend/${{ matrix.module }}
        run: ../gradlew :${{ matrix.module }}:test -B -Dspring.profiles.active=test

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: backend/${{ matrix.module }}/build/reports/jacoco/test/index.html
          retention-days: 7

  # =====================================================================
  # Frontend Phase 1: Static Analysis (ESLint + TypeScript typecheck)
  # =====================================================================
  frontend-lint:
    name: Frontend Lint
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('dashboard/package.json', 'dashboard/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: dashboard

      - name: ESLint
        run: yarn lint
        working-directory: dashboard
        continue-on-error: true

  # =====================================================================
  # Frontend Phase 2: TypeScript typecheck
  # =====================================================================
  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('dashboard/package.json', 'dashboard/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: dashboard

      - name: TypeScript typecheck
        run: yarn typecheck
        working-directory: dashboard

  # =====================================================================
  # Frontend Phase 2: Compile (Vite build)
  # =====================================================================
  frontend-compile:
    name: Frontend Compile
    runs-on: self-hosted
    needs: [frontend-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('dashboard/package.json', 'dashboard/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: dashboard

      - name: Vite build
        run: yarn build
        working-directory: dashboard

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dashboard/dist/
          retention-days: 7

  # =====================================================================
  # Frontend Phase 3: Unit Tests (Vitest)
  # =====================================================================
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: self-hosted
    needs: [frontend-compile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('dashboard/package.json', 'dashboard/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: dashboard

      - name: Vitest unit tests
        run: yarn test -- --run
        working-directory: dashboard

  # =====================================================================
  # Frontend Phase 4: Integration Tests (Playwright E2E)
  # =====================================================================
  frontend-integration-tests:
    name: Frontend E2E Tests
    runs-on: self-hosted
    needs: [frontend-compile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('dashboard/package.json', 'dashboard/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: dashboard

      - name: Playwright E2E tests
        run: |
          yarn playwright install --with-deps chromium
          yarn playwright test
        working-directory: dashboard

  # =====================================================================
  # Security
  # =====================================================================
  security:
    name: Security Scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP dependency check
        run: |
          if command -v owasp-sbom &> /dev/null; then
            owasp-sbom -f XML -o reports/owasp.xml
          else
            echo "OWASP SBOM not installed, skipping"
          fi

      - name: Check for secrets
        run: |
          if command -v trufflehog &> /dev/null; then
            trufflehog filesystem --only-passed .
          else
            echo "TruffleHog not installed, skipping"
          fi
