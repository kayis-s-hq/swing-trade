name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_OPTS: -Xms256m -Xmx512m

jobs:
  # =====================================================================
  # Phase 1: Static Analysis (PMD + Checkstyle) — per module, parallel
  # =====================================================================
  static-analysis:
    name: Static Analysis (${{ matrix.module }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: [core, data, strategy, llm, broker, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Checkstyle + PMD
        working-directory: backend/${{ matrix.module }}
        run: MAVEN_OPTS="$JAVA_OPTS" mvn checkstyle:check pmd:check -B

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-${{ matrix.module }}
          path: backend/${{ matrix.module }}/target/site/pmd.html
          retention-days: 7

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-${{ matrix.module }}
          path: backend/${{ matrix.module }}/target/checkstyle-result.xml
          retention-days: 7

  # =====================================================================
  # Phase 2: Compile — per module, parallel (depends on static-analysis)
  # =====================================================================
  compile:
    name: Compile (${{ matrix.module }})
    runs-on: self-hosted
    needs: [static-analysis]
    strategy:
      fail-fast: false
      matrix:
        module: [core, data, strategy, llm, broker, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile + package (skip tests)
        working-directory: backend/${{ matrix.module }}
        run: MAVEN_OPTS="$JAVA_OPTS" mvn compile package -B -Dmaven.test.skip=true

      - name: Upload JAR
        if: matrix.module == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: backend/api/target/api-1.0.0.jar
          retention-days: 1

  # =====================================================================
  # Phase 3: Unit Tests — per module, parallel (skip IT, PMD, Checkstyle)
  # =====================================================================
  unit-tests:
    name: Unit Tests (${{ matrix.module }})
    runs-on: self-hosted
    needs: [compile]
    strategy:
      fail-fast: false
      matrix:
        module: [core, data, strategy, llm, broker, api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Unit tests only
        working-directory: backend/${{ matrix.module }}
        run: MAVEN_OPTS="$JAVA_OPTS" mvn test -B -Dspring.profiles.active=test -DskipITs=true -Dpmd.skip=true -Dcheckstyle.skip=true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.module }}
          path: backend/${{ matrix.module }}/target/site/jacoco-index.html
          retention-days: 7

  # =====================================================================
  # Phase 4: Integration Tests — per module, parallel (skip unit tests)
  # =====================================================================
  integration-tests:
    name: Integration Tests (${{ matrix.module }})
    runs-on: self-hosted
    needs: [compile]
    strategy:
      fail-fast: false
      matrix:
        module: [api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Integration tests only
        working-directory: backend/${{ matrix.module }}
        run: MAVEN_OPTS="$JAVA_OPTS" mvn failsafe:integration-test failsafe:verify -B -Dspring.profiles.active=test -DskipTests=true -Dpmd.skip=true -Dcheckstyle.skip=true

  # =====================================================================
  # Frontend
  # =====================================================================
  frontend:
    name: Frontend (Node 20)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: dashboard/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('dashboard/package.json', 'dashboard/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run typecheck
        run: npm run typecheck
        working-directory: dashboard

      - name: Run unit tests
        run: npm run test -- --run
        working-directory: dashboard

      - name: Run E2E tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: dashboard

      - name: Build
        run: npm run build
        working-directory: dashboard

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dashboard/dist/
          retention-days: 7

  # =====================================================================
  # Security
  # =====================================================================
  security:
    name: Security Scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP dependency check
        run: |
          if command -v owasp-sbom &> /dev/null; then
            owasp-sbom -f XML -o reports/owasp.xml
          else
            echo "OWASP SBOM not installed, skipping"
          fi

      - name: Check for secrets
        run: |
          if command -v trufflehog &> /dev/null; then
            trufflehog filesystem --only-passed .
          else
            echo "TruffleHog not installed, skipping"
          fi