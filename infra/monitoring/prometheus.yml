global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Dev API — local Mac, scraped by pi-prometheus via host.docker.internal
  - job_name: swing-trade-dev
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: swing-trade-dev
          module: api

  # Stage API — Docker container on pi-node, scraped by pi-prometheus
  - job_name: swing-trade-stage
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['swing-trade-stage-api:8080']
        labels:
          application: swing-trade-stage
          module: api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']