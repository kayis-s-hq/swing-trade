global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Deploy alongside prometheus.yml on pi-node (same directory), then reload Prometheus.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          instance: pi

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: caddy
    static_configs:
      - targets: ['caddy:9187']

  - job_name: swing-trade-stage
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['swing-trade-stage-api:8080']
        labels:
          application: swing-trade-stage
          module: api

  - job_name: vllm
    metrics_path: /metrics
    scheme: https
    scrape_interval: 5m
    static_configs:
      - targets: ['u425-b06e-bde186b5.singapore-b.gpuhub.com']
        labels:
          instance: gpuhub-vllm
    tls_config: