global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: swing-trade-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: swing-trade-stage
          module: api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']