# Market Data Client Configuration
market-data:
  client-type: ${MARKET_DATA_CLIENT:yahoo-finance}

yahoo-finance:
  enabled: true
  base-url: https://query1.finance.yahoo.com

upstox:
  api:
    base-url: https://api.upstox.com
  access-token: ${UPSTOX_ACCESS_TOKEN:}
  client-id: ${UPSTOX_CLIENT_ID:}
  client-secret: ${UPSTOX_CLIENT_SECRET:}
  redirect-uri: ${UPSTOX_REDIRECT_URI:http://localhost:8080/api/auth/upstox/callback}
  token-store-path: ${UPSTOX_TOKEN_STORE_PATH:data/upstox-tokens.json}

spring:
  application:
    name: swing-trade-data
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

logging:
  level:
    com.swingtrade.data: DEBUG
    org.springframework.web: DEBUG
