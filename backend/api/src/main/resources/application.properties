# =============================================================================
# Swing Trade Application - Main Configuration
# =============================================================================
# Spring Boot Application Configuration
# =============================================================================

# Server Configuration
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Application Info
spring.application.name=swing-trade-api
spring.main.allow-bean-definition-overriding=true

# =============================================================================
# Database Configuration (PostgreSQL + TimescaleDB)
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swingtrade_db}?currentSchema=public
spring.datasource.username=${DB_USER:swingtrade_user}
spring.datasource.password=${DB_PASSWORD:swingtrade_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=SwingTradeHikariCP
spring.datasource.hikari.auto-commit=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.time_zone=Asia/Kolkata

# Flyway Configuration (disabled for local dev - TimescaleDB not installed)
spring.flyway.enabled=false

# =============================================================================
# Redis Configuration
# =============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration
spring.cache.type=redis
spring.cache.cache-names=stocks,ohlcv,signals,sentiment
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=swingtrade:
spring.cache.redis.use-key-prefix=true

# =============================================================================
# Upstox API Configuration
# =============================================================================
upstox.api.base-url=https://api.upstox.com
upstox.client-id=${UPSTOX_CLIENT_ID:}
upstox.client-secret=${UPSTOX_CLIENT_SECRET:}
upstox.redirect-uri=${UPSTOX_REDIRECT_URI:http://localhost:8080/auth/upstox/callback}
upstox.access-token=${UPSTOX_ACCESS_TOKEN:}
upstox.token-store-path=${UPSTOX_TOKEN_STORE_PATH:data/upstox-tokens.json}

# =============================================================================
# =============================================================================
# LLM / vLLM Configuration
# =============================================================================
llm.base-url=${LLM_BASE_URL:http://localhost:8080/v1}
llm.temperature=${LLM_TEMPERATURE:0.0}
llm.timeout.millis=${LLM_TIMEOUT:30000}
llm.max-tokens=4096
llm.gpuhub.base-url=${LLM_GPUHUB_BASE_URL:https://u425-84cf-d540ae09.singapore-b.gpuhub.com:8443/v1}
llm.gpuhub.model-name=${LLM_GPUHUB_MODEL_NAME:gemma-3-27b-it}

# =============================================================================
# GPUHUB Deployment API Configuration
# =============================================================================
gpuhub.api.base-url=${GPUHUB_API_BASE_URL:https://www.gpuhub.com}
gpuhub.api.api-key=${GPUHUB_API_KEY:}

# LLM Retry Configuration
llm.retry.enabled=true
llm.retry.max-attempts=3
llm.retry.backoff.millis=1000
llm.retry.exponential-backoff=true

# LLM Backend Selection (local | pi_ssh | gpuhub)
llm.backend=local

# llama.cpp Pi SSH Configuration
llamacpp.ssh.user=dietpi
llamacpp.ssh.host=192.168.0.100
llamacpp.port=8090
llamacpp.idle-timeout=300
llamacpp.threads=2
llamacpp.context=1024

# Sentiment Analysis Configuration
llm.sentiment.prompt.system=You are a financial analyst specialising in Indian equity markets. Analyse the following for a swing trade entry decision on {symbol}.
llm.sentiment.prompt.user=News: {headlines}\nEarnings: {earnings}\nReturn JSON: {score, confidence, summary, red_flags, catalysts}
llm.sentiment.cache.max-size=100
llm.sentiment.cache.expiry-minutes=60
llm.sentiment.cache.enabled=true
llm.sentiment.default-confidence=0.75
llm.telegram.digest-chat-id=${TELEGRAM_DIGEST_CHAT_ID:123456789}

# News Ingestion Configuration
news.nse.endpoint=https://nseindia.com/api/corporate-announcements
news.fetch.limit=50
news.cache.enabled=true
news.cache.ttl.seconds=3600
news.source.timeout=10
news.source.moneycontrol.enabled=true
news.source.moneycontrol.max-articles=15
news.source.et.enabled=true
news.source.et.max-articles=15
news.source.google.enabled=true
news.source.google.max-articles=20
news.source.nse.enabled=true
news.source.bse.enabled=true
news.source.reddit.enabled=true
news.source.reddit.max-articles=15
news.source.finnhub.enabled=true
news.source.finnhub.max-articles=15
news.source.finnhub.api-key=d9im9fhr01qs513msge0d9im9fhr01qs513msgeg
news.reddit.client-id=
news.reddit.client-secret=

# =============================================================================
# Signal Notification Configuration
# =============================================================================
signal.enabled=${SIGNAL_ENABLED:false}
signal.api.token=${SIGNAL_API_TOKEN:}
signal.chat.id=${SIGNAL_CHAT_ID:}

# Notification Configuration
signal.notify.on.trades=true
# Deferred per project decision
signal.notify.on.signals=false
signal.notify.on.errors=false
signal.notify.max.message.length=4096

# Quiet Hours Configuration (optional)
signal.quiet.hours.enabled=false
signal.quiet.hours.start=22
signal.quiet.hours.end=7

# =============================================================================
# Telegram Bot Configuration (REMOVED - replaced with Signal)
# =============================================================================
# telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}
# telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
