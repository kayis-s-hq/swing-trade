# =============================================================================
# Trading Configuration
# =============================================================================
trading.enabled=${TRADING_ENABLED:false}
trading.paper.trading.enabled=true
trading.max.position.size.percentage=10
trading.max.exposure.percentage=50
trading.stop.loss.percentage=5.0
trading.take.profit.percentage=15.0
trading.min.signal.confidence=60.0

# Order Configuration
trading.order.type.DEFAULT=MARKET
trading.order.type.LIMIT=LIMIT
trading.order.expiry=DAY
trading.order.exchange=NSE

# =============================================================================
# Strategy Configuration
# =============================================================================
strategy.enabled=true
strategy.decision.threshold=60
strategy.max.open.positions=5
strategy.rebalance.interval.hours=24

# Technical Analysis Settings
strategy.ta.rsi.period=14
strategy.ta.rsi.overbought=70
strategy.ta.rsi.oversold=30
strategy.ta.sma.period.short=20
strategy.ta.sma.period.long=50
strategy.ta.ema.period.fast=12
strategy.ta.ema.period.slow=26
strategy.ta.macd.fast=12
strategy.ta.macd.slow=26
strategy.ta.macd.signal=9

# =============================================================================
# Discord Webhook Configuration
# =============================================================================
discord.webhook.url=${DISCORD_WEBHOOK_URL:}
discord.webhook.enabled=${DISCORD_WEBHOOK_ENABLED:false}

# =============================================================================
# PDF Extraction (Pi 5 llama-server)
# =============================================================================
llm.pdf.base-url=${LLM_PDF_BASE_URL:}
llm.pdf.model=${LLM_PDF_MODEL:gemma-4-E2B}

# =============================================================================
# Logging Configuration
# =============================================================================
logging.level.root=INFO
logging.level.com.swingtrade=DEBUG
logging.level.com.swingtrade.api=DEBUG
logging.level.com.swingtrade.data=DEBUG
logging.level.com.swingtrade.strategy=DEBUG
logging.level.com.swingtrade.llm=DEBUG
logging.level.com.swingtrade.broker=DEBUG
logging.level.com.swingtrade.core=INFO

# Specific Package Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.flywaydb=INFO
logging.level.io.lettuce=INFO

# Log file path (JSON file appender configured in logback-spring.xml)
logging.file.name=${LOG_FILE:./logs/swing-trade-local.log}

# =============================================================================
# Actuator / Health Check Configuration
# =============================================================================
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.exposure.exclude=env,configprops
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livelystate.enabled=true
management.health.readystate.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=10485760

# Metrics Configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}
management.endpoints.web.base-path=/actuator
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Prometheus Configuration
management.prometheus.metrics.export.enabled=true
management.prometheus.metrics.export.step=60s

# =============================================================================
# Security Configuration
# =============================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# =============================================================================
# Application Features
# =============================================================================
app.features.data-ingestion.enabled=true
app.features.strategy.enabled=true
app.features.sentiment-analysis.enabled=true
app.features.paper-trading.enabled=true
app.features.real-trading.enabled=false

# =============================================================================
# Monitoring & Observability
# =============================================================================
app.monitoring.enabled=true
app.monitoring.metrics.interval.seconds=60
app.monitoring.health.interval.seconds=30

# =============================================================================
# Environment-Specific Overrides
# =============================================================================
# Use application-{profile}.properties for environment-specific settings
# Load order: application.properties -> application-{profile}.properties

# =============================================================================
# Resilience4j — Circuit Breaker, Retry, Bulkhead, Time Limiter
# =============================================================================
# Circuit breaker auto-config disabled — we create instances programmatically
# in Resilience4jConfig to compose multiple patterns per client.
resilience4j.circuitbreaker.enabled=false
resilience4j.bulkhead.enabled=false
resilience4j.timelimiter.enabled=false

# Retry auto-config kept — used via @Retry annotation in some services.
resilience4j.retry.enabled=true
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s
resilience4j.retry.configs.default.enable-exponential-backoff=true

# Aspect order (kept for any @CircuitBreaker annotations that may be added later)
resilience4j.circuitbreaker.circuitBreakerAspectOrder=1
resilience4j.retry.retryAspectOrder=2
