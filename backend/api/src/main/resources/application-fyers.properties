# =============================================================================
# Swing Trade Application - Fyers Profile Configuration
# =============================================================================

# Server Configuration
server.port=8080

# Database Configuration (Docker Compose)
spring.datasource.url=jdbc:postgresql://${DB_HOST:192.168.0.100}:${DB_PORT:5435}/${DB_NAME:swingtrade_db}?currentSchema=public
spring.datasource.username=swingtrade_user
spring.datasource.password=swingtrade_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.time_zone=Asia/Kolkata

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Configuration
spring.data.redis.host=192.168.0.100
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000ms
spring.cache.type=redis
spring.cache.cache-names=stocks,ohlcv,signals,sentiment
spring.cache.redis.time-to-live=3600000

# =============================================================================
# Fyers API Configuration
# =============================================================================
fyers.clientId=${FYERS_CLIENT_ID:}
fyers.secretKey=${FYERS_SECRET_KEY:}
fyers.redirectUrl=http://127.0.0.1:8080/api/fyers/callback
# 4-digit Fyers PIN, required for token refresh (validate-refresh-token)
fyers.pin=${FYERS_PIN:}
# These will be populated after you run the auth flow
fyers.accessToken=
fyers.refreshToken=

# =============================================================================
# Trading & Strategy Configuration
# =============================================================================
trading.enabled=true
trading.paper.trading.enabled=true
trading.max.position.size.percentage=10
trading.max.exposure.percentage=50
trading.stop.loss.percentage=5.0
trading.take.profit.percentage=15.0
trading.min.signal.confidence=60.0

strategy.enabled=true
strategy.decision.threshold=60
strategy.max.open.positions=5
strategy.rebalance.interval.hours=24

# Logging
logging.level.root=INFO
logging.level.com.swingtrade=DEBUG
logging.level.org.hibernate.SQL=DEBUG
