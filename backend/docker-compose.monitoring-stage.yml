# Stage monitoring — Grafana on local Mac scraping pi-node Prometheus
# Prometheus + Grafana on pi-node handle all scraping and dashboards
# This runs local Grafana for convenient dashboard access on port 3002
name: swing-trade-stage-monitoring

services:
  grafana:
    image: grafana/grafana:11.0.0
    container_name: swing_trade_grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-swingtrade}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  grafana_data:

networks:
  monitoring:
    driver: bridge