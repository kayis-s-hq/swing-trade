# Stage Infrastructure - Docker Compose (runs on pi-node)
# Separate from dev: different ports, volumes, and database
# Usage: docker compose -f docker-compose.infra-stage.yml up -d
name: swing-trade-stage

services:
  api:
    image: swing-trade-api:latest
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime-jar
    container_name: swing-trade-stage-api
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=stage
      - DB_HOST=swing_trade_stage_postgres
      - DB_USER=swingtrade_user
      - DB_PASSWORD=swingtrade_password
      - REDIS_HOST=swing_trade_stage_redis
      - REDIS_PORT=6379
      - LLM_BASE_URL=http://localhost:8000
      - LLM_MODEL_NAME=claude-sonnet-4-6
      - LLM_TIMEOUT=30000
      - TRADING_ENABLED=true
      - PAPER_TRADING_ENABLED=true
      - REAL_TRADING_ENABLED=false
      - STRATEGY_ENABLED=true
      - SIGNAL_ENABLED=false
      - DISCORD_WEBHOOK_ENABLED=false
    networks:
      - swingtrade-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: postgres:16
    container_name: swing_trade_stage_postgres
    volumes:
      - postgres_data_stage:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: swingtrade_stage
      POSTGRES_USER: swingtrade_user
      POSTGRES_PASSWORD: swingtrade_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5436:5432"
    networks:
      - swingtrade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingtrade_user -d swingtrade_stage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: swing_trade_stage_redis
    volumes:
      - redis_data_stage:/data
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    networks:
      - swingtrade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data_stage:
  redis_data_stage:

networks:
  swingtrade-network:
    driver: bridge