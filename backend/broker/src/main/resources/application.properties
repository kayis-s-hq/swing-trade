# =============================================================================
# Swing Trade Application - Broker Module Configuration
# =============================================================================
# Spring Boot Application Configuration for Broker Module
# =============================================================================

# Server Configuration (if running as standalone)
server.port=8081
server.servlet.context-path=/broker

# Application Info
spring.application.name=swing-trade-broker

# =============================================================================
# Database Configuration (PostgreSQL + TimescaleDB)
# =============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swingtrade_db}?currentSchema=broker
spring.datasource.username=${DB_USER:swingtrade_user}
spring.datasource.password=${DB_PASSWORD:swingtrade_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=BrokerHikariCP
spring.datasource.hikari.auto-commit=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.time_zone=Asia/Kolkata

# Flyway — disabled: broker is a library module, API module handles all migrations
spring.flyway.enabled=false

# =============================================================================
# Redis Configuration (for caching)
# =============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Cache Configuration
spring.cache.type=redis
spring.cache.cache-names=positions,orders,portfolio
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=broker:
spring.cache.redis.use-key-prefix=true

# =============================================================================
# Telegram Bot Configuration (Broker Module)
# =============================================================================
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}

# Telegram Chat IDs - Configure your Telegram chat ID(s) here
# Get your chat ID by sending a message to @userinfobot on Telegram
# Multiple chat IDs can be comma-separated: chatId1,chatId2,chatId3
telegram.chat.ids=${TELEGRAM_CHAT_IDS:}

# Notification Configuration
telegram.notify.on.trades=true
telegram.notify.on.signals=true
telegram.notify.on.errors=true
telegram.notify.on.positions=true
telegram.notify.max.message.length=4096
telegram.notify.rate.limit.seconds=60

# Admin User IDs (comma-separated)
telegram.admin.user.ids=${TELEGRAM_ADMIN_IDS:}

# =============================================================================
# Trading Configuration
# =============================================================================
trading.enabled=${TRADING_ENABLED:false}
trading.paper.trading.enabled=true
trading.max.position.size.percentage=10
trading.max.exposure.percentage=50
trading.stop.loss.percentage=5.0
trading.take.profit.percentage=15.0
trading.min.signal.confidence=60.0

# Order Configuration
trading.order.type.DEFAULT=MARKET
trading.order.type.LIMIT=LIMIT
trading.order.expiry=DAY
trading.order.exchange=NSE

# =============================================================================
# Paper Trading Engine Configuration
# =============================================================================
paper.trading.enabled=true
paper.trading.max.concurrent.positions=5
paper.trading.max.capital.per.position=20
paper.trading.initial.balance=500000
paper.trading.signal-execution-delay=30000

# Position Management
paper.trading.position.size.limits.enabled=true
paper.trading.position.size.alert.threshold=80

# Order Management
paper.trading.order.execution.enabled=true
paper.trading.order.simulation.latency.millis=100

# Paper Trading State Persistence
paper.trading.state-persistence.enabled=true

# Scheduling (IST) — monitor at 15:30, snapshot at 15:45
paper.trading.snapshot-cron=0 45 15 * * MON-FRI
paper.trading.monitor-cron=0 30 15 * * MON-FRI

# =============================================================================
# Broker Service Configuration
# =============================================================================
broker.commission.per.trade=0.01
broker.commission.min=10
broker.slippage.percentage=0.05

# =============================================================================
# Logging Configuration
# =============================================================================
logging.level.root=INFO
logging.level.com.swingtrade=DEBUG
logging.level.com.swingtrade.broker=DEBUG

# Specific Package Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.flywaydb=INFO
logging.level.io.lettuce=INFO
logging.level.com.swingtrade.broker.telegram=DEBUG

# Log File Configuration
logging.file.name=${LOG_FILE:/var/log/swing-trade/broker.log}
logging.file.max-size=100MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================================================
# Actuator / Health Check Configuration
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.exposure.exclude=env,configprops
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# =============================================================================
# Broker Mode Configuration (Phase 6 - Live Trading)
# =============================================================================
# Broker mode: paper, live, dry_run
# - paper: Paper trading mode (simulation, existing behavior)
# - live: Live trading mode (sends orders to Zerodha Kite Connect)
# - dry_run: Dry-run mode (logs orders without sending to broker)
#
# SAFETY DEFAULT: Start with dry_run for testing before live trading
broker.mode=paper

# =============================================================================
# Zerodha Kite Connect Configuration (for live/dry_run modes)
# =============================================================================
# API Key - Get from Zerodha Console (https://kite.trade)
# IMPORTANT: Replace [YOUR_ZERODHA_API_KEY] with actual API key from Zerodha dashboard
# See: .planning/phases/06-live-trading/06-01-live-trading-CONTEXT.md for setup instructions
kite.api-key=[YOUR_ZERODHA_API_KEY]

# Access Token - Obtained after OAuth authorization flow
# IMPORTANT: Replace [YOUR_ACCESS_TOKEN_FROM_OAUTH] with actual token from OAuth flow
# See: .planning/phases/06-live-trading/06-01-live-trading-CONTEXT.md for OAuth instructions
kite.access-token=[YOUR_ACCESS_TOKEN_FROM_OAUTH]

# Environment: live or sandbox (use sandbox for testing)
# For live trading, set to 'live'. For testing, use 'sandbox' if available.
kite.environment=live

# Proxy configuration (optional, for corporate networks)
kite.proxy-host=
kite.proxy-port=0

# =============================================================================
# Risk Control Limits
# =============================================================================
# Maximum concurrent open positions
# Paper mode: 5 positions | Live mode: 3 positions (conservative)
broker.max-concurrent-positions=3

# Maximum capital allowed per position (in INR)
# For ₹50K live capital: 20% = ₹10,000 per position
# For ₹1M paper capital: 10% = ₹100,000 per position
broker.max-capital-per-position=16666

# Maximum capital allowed per trade (in INR)
# Same as max-capital-per-position for consistency
broker.max-capital-per-trade=16666

# Daily loss circuit breaker (percentage of initial capital)
# 2% daily loss limit - stops trading if reached
broker.daily-loss-circuit-breaker=2.0

# Initial capital for position sizing calculations
# ₹50,000 for live trading | ₹1,000,000 for paper trading
broker.initial-capital=50000

# Maximum position size as percentage of capital
broker.max-position-size-percentage=10

# Minimum position size as percentage of capital (optional warning)
broker.min-position-size-percentage=1

# =============================================================================
# Kill Switch Configuration
# =============================================================================
# Enable kill switch functionality
broker.kill-switch-enabled=true

# Kill switch active state (set via API or Telegram)
broker.kill-switch-active=false

# =============================================================================
# Feature Flags
# =============================================================================
app.features.paper-trading.enabled=true
app.features.telegram-notifications.enabled=true
app.features.order-management.enabled=true
app.features.position-tracking.enabled=true
app.features.live-trading.enabled=false
app.features.risk-controls.enabled=true
