# Dev Stack - Infrastructure only (run on pi-node)
# Usage: docker compose -f docker-compose.infra.yml up -d
name: swing-trade-dev

services:
  postgres:
    image: postgres:16
    container_name: swing_trade_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: swingtrade_db
      POSTGRES_USER: swingtrade_user
      POSTGRES_PASSWORD: swingtrade_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    networks:
      - swingtrade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingtrade_user -d swingtrade_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: swing_trade_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - swingtrade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  swingtrade-network:
    driver: bridge
